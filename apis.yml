aid: offr
name: Offr
description: >-
  Offr (Offr.io Ltd) is a Dublin-based property technology (proptech) platform that
  digitizes end-to-end real estate transactions. Estate and letting agents embed the
  Offr "offer panel" / button on their own website to run private-treaty sales, online
  auctions, tenders, lettings, and new-home sales - collecting verified offers and bids,
  scheduling viewings, managing a legal document vault with e-signing, taking secure
  deposits (via Stripe), and streaming live auction broadcasts, all with a fully auditable
  transaction trail. The platform serves residential and commercial agents, buyers, sellers,
  landlords, tenants, developers, and solicitors across Ireland, the UK, Europe, the USA,
  and Australia. Offr is a SaaS/embedded product; it exposes no public developer API,
  developer portal, or OpenAPI at this time and integrates DocuSign, Stripe, and AWS as a
  consumer. Surfaced as a Techstars portfolio company and enriched from public web sources.
